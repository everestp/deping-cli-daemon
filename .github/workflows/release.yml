name: Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: deping-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            output: deping-macos-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Rename
        run: mv target/release/deping ${{ matrix.output }}
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}