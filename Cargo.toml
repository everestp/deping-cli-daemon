[package]
name = "depin_miner"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tonic = { version = "0.11", features = ["transport", "tls-roots"] }
prost = "0.12"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
rand = "0.8"
url = "2.5"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
