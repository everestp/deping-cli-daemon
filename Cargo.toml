[package]
name = "deping"
version = "0.1.0"
edition = "2021"

# -----------------------------
# CORE DEPENDENCIES
# -----------------------------
[dependencies]
tokio = { version = "1.38", features = ["full"] }

tonic = { version = "0.11", features = ["transport", "tls-roots"] }
prost = "0.12"

reqwest = { version = "0.12", features = ["json", "native-tls"] }

tokio-stream = "0.1"

# -----------------------------
# LOGGING / DEBUGGING
# -----------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# -----------------------------
# ERROR HANDLING
# -----------------------------
anyhow = "1.0"
thiserror = "1.0"

# -----------------------------
# CLI (deping setup/start)
# -----------------------------
clap = { version = "4", features = ["derive"] }

# -----------------------------
# CRYPTO (Solana-style identity)
# -----------------------------
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
# -----------------------------
# FILE SYSTEM / PATHS
# -----------------------------
dirs = "5"

# -----------------------------
# JSON STORAGE (keypair, config)
# -----------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# -----------------------------
# URL utilities (optional but useful for network validation)
# -----------------------------
url = "2.5"

# -----------------------------
# BUILD (gRPC codegen)
# -----------------------------
[build-dependencies]
tonic-build = "0.11"

# -----------------------------
# RELEASE OPTIMIZATION (IMPORTANT)
# -----------------------------
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
